version: 1.0

###################
# COMMON SETTINGS #
###################

dataset_path: ../benchmark

# Set to null to run all pipelines, models, languages simultaneously.
max_parallel_runs: null

ollama_base_url: http://localhost:11434

#############
# INFERENCE #
#############

pipelines:
  - [as_is]
  - [negation]
  - [negation, wrapper]
  - [antonyms]
  - [antonyms, wrapper]
  - [synonyms]
  - [synonyms, wrapper]

models:
  - xai/grok-4-1-fast-non-reasoning
  - openrouter/deepseek/deepseek-v3.2
  - openrouter/google/gemini-2.5-flash
  - openrouter/google/gemini-2.5-flash-lite
  - openrouter/mistralai/ministral-14b-2512
  - openai/gpt-5-nano-2025-08-07
  - openai/gpt-5-mini-2025-08-07
  - openai/gpt-5.2-2025-12-11
  - anthropic/claude-sonnet-4-5-20250929
  - ollama_chat/gemma3:27b

languages:
  - en
  # - es
  # - cs

# Model used to preprocess the texts (e.g., negating them, or replacing with
# antonyms).
preprocessing_model: openai/gpt-5-mini-2025-08-07

output_path: ../output_000

##############
# EVALUATION #
##############

judge_models:
  - openrouter/moonshotai/kimi-k2.5

evaluation_path: ../eval_000
